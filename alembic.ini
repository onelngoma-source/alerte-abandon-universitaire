# Migrations de la base (Alembic). A lancer depuis la racine du projet, avec les memes variables
# d'environnement que l'application (DATABASE_URL ou DB_PATH) :
#   alembic current                       revision actuelle de la base
#   alembic upgrade head                  mise a jour (faite aussi automatiquement au demarrage)
#   alembic revision --autogenerate -m "ajout de ..."   nouvelle migration, A RELIRE avant de la valider
[alembic]
script_location = migrations
prepend_sys_path = .
