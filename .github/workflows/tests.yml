# Integration continue : a chaque envoi sur GitHub, toute la suite de tests tourne deux fois (SQLite puis
# PostgreSQL, navigateur compris), puis les analyses de securite du code et des dependances.
# Une modification qui casse une garantie (calcul, droits, verrouillage, sauvegarde...) est signalee avant
# d'atteindre le serveur de l'etablissement.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: tests
          POSTGRES_DB: alerte_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Dependances
        run: |
          pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Seconde base PostgreSQL (essais de restauration)
        run: psql -h localhost -U postgres -c "CREATE DATABASE alerte_essai"
      - name: Tests (SQLite)
        run: python -m pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:tests@localhost:5432/alerte_test
        run: python -m pytest -q
      - name: Analyse de securite du code (bandit)
        run: bandit -r . -x ./tests,./scripts -ll
      - name: Vulnerabilites connues des dependances (pip-audit)
        run: pip-audit -r requirements.txt
